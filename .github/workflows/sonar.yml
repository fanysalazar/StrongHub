name: SonarQube Cloud
on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the SonarScanner for .NET
        shell: powershell
        run: dotnet tool install --global dotnet-sonarscanner; dotnet tool install --global dotnet-coverage

      - name: Build and analyze
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"fanysalazar_StrongHub" /o:"fanysalazar" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.coverage.exclusions="src/StrongHub.Views/**"
          dotnet build --no-incremental
          dotnet-coverage collect "dotnet test --no-build" -f xml -o coverage.xml
          dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

